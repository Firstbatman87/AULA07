<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gerador de Cartão</title>
</head>
<body>
    <div class="gerador">
        <h1><img src="images.jpg">Gerador de Cartão de Perfil</h1>
        <input type="text" name="nome" id="nome" placeholder="Seu nome">
        <input type="text" name="profissao" id="profissao" placeholder="Sua profissão ou frase">
        <button type="submit">Gerar Cartão</button>
    </div>
    <div class="card">
        <span>Seu nome aqui</span>
        <span>Sua profissão aqui</span>
    </div>
    <p>Cartões gerados: 0</p>
</body>
</html>
